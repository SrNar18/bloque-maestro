<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Maqueta en revisión: no indexar. Quitar esta línea al lanzar la web. -->
<meta name="robots" content="noindex, nofollow">
<title>Anúnciate — Bloque Maestro</title>
<link rel="canonical" href="https://bloquemaestro.com/anunciate.html">
<meta name="description" content="Publica tu proyecto de construcción en Bloque Maestro y recibe contactos de inversores, proveedores y profesionales.">
<link rel="icon" href="assets/icono_claro_sin_fondo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Inter:wght@300;400;500;600;700&family=Michroma&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="assets/styles.css?v=18">
</head>
<body data-page="anunciate">
<div class="glow"></div>
<main class="w" id="app"></main>

<script>/* Contenido editable desde /admin (?preview muestra el borrador del panel, ?edit abre el editor visual) */
(function () { var q = location.search, f = window.top !== window, d; try { d = (/[?&](preview|edit)/.test(q) || f) && localStorage.getItem('bm_preview'); } catch (e) {}
  if (d) window.BM_CONTENT = JSON.parse(d); else document.write('<script src="assets/content.js?t=' + Math.floor(Date.now() / 6e4) + '"><\/script>');
  if (f && /[?&]edit/.test(q)) document.write('<script src="admin/inline.js?v=2"><\/script>'); })();</script>
<script src="assets/data.js?v=5"></script>
<script src="assets/app.js?v=8"></script>
<script>
const T = BM.C.anunciate;
const P = BM.byId(T.sample) || BM.PROJECTS[0];
const PLANS = T.plans, FAQ = T.faq;
const chips = (name, opts, sel) => opts.map(o => `<label><input type="radio" name="${name}" value="${o}" ${o === sel ? 'checked' : ''}><span>${o}</span></label>`).join('');

document.getElementById('app').innerHTML = `
<!-- 1 · HERO -->
<section class="ad-hero full bgx bg-hero">
  <div class="rv">
    <div class="crumbs"><a href="index.html">Inicio</a><i class="fa-solid fa-chevron-right"></i>Anúnciate</div>
    <div class="kick">${T.kick}</div>
    <h1 class="display">${T.title}</h1>
    <p class="lead">${T.lead}</p>
    <div class="ctas"><a href="solicitud.html" class="btn">Anunciar mi proyecto <i class="fa-solid fa-arrow-right"></i></a><a href="#planes" class="btn-sec">Ver planes</a></div>
    <div class="trust">${T.trust.map(t => `<span><i class="fa-solid fa-check"></i> ${t}</span>`).join('')}</div>
  </div>
  <div class="ad-vis rv">
    <div class="mini-card">${BM.ph(P.img[0], 700, 520).replace('loading="lazy"', '')}<div class="mc-in"><span class="chip">${BM.status(P.status)}</span><b>${P.short}</b><small><i class="fa-solid fa-location-dot"></i> ${P.city}</small></div></div>
    <div class="notif n1"><i class="fa-solid fa-envelope"></i><span><b>Nueva solicitud</b><small>Inversor · Fondo Andino Capital</small></span></div>
    <div class="notif n2"><i class="fa-solid fa-truck-fast"></i><span><b>Nueva solicitud</b><small>Proveedor · Aceros del Valle</small></span></div>
    <div class="notif n3"><i class="fa-solid fa-chart-line"></i><span><b>+4.812 visitas</b><small>en los últimos 30 días</small></span></div>
  </div>
</section>

<!-- 2 · CIFRAS -->
<section class="nums rv">
  ${T.nums.map(([n, suf, t]) => `<div><b data-n="${n}" data-suf="${suf}">0</b><span>${t}</span></div>`).join('')}
</section>

<!-- 3 · CÓMO FUNCIONA -->
<section class="band bgx bg-blueprint">
  <div class="sh rv"><h2><small class="mono">Cómo funciona</small>${T.flowTitle}</h2></div>
  <div class="flow">
    ${T.flow.map(([ic, t, d], i) => `<div class="fl rv"><span class="fn">${i + 1}</span><i class="fa-solid ${ic}"></i><h3>${t}</h3><p>${d}</p></div>`).join('')}
  </div>
</section>

<!-- 4 · QUÉ OBTIENES -->
<section class="band bgx bg-light light">
  <div class="sh rv"><h2><small class="mono">Qué obtienes</small>Mucho más que un anuncio</h2></div>
  <div class="gets">
    <div class="get big rv"><div><i class="fa-solid fa-envelope-open-text"></i><h3>Contactos cualificados</h3><p>Sabes quién es, qué le interesa y cómo contactarle.</p></div>
      <div class="lead-demo"><div class="ld-h"><span class="dot"></span>Nueva solicitud · ${P.short}</div>
        <div class="ld-r"><small>Nombre</small><b>Carlos Méndez</b></div><div class="ld-r"><small>Perfil</small><b>Inversor</b></div><div class="ld-r"><small>Empresa</small><b>Fondo Andino Capital</b></div>
        <div class="ld-m">“Nos interesa conocer el calendario de entrega y la estructura de inversión…”</div></div></div>
    <div class="get rv"><i class="fa-solid fa-file-lines"></i><h3>Ficha técnica pro</h3><p>Terreno, materiales, equipos y equipo humano.</p></div>
    <div class="get rv"><i class="fa-solid fa-bullhorn"></i><h3>Difusión</h3><p>Newsletter semanal y redes sociales.</p></div>
    <div class="get rv"><i class="fa-solid fa-chart-pie"></i><h3>Métricas</h3><p>Visitas, contactos y perfil de interesados.</p></div>
    <div class="get rv"><i class="fa-solid fa-medal"></i><h3>Reputación</h3><p>Tu empresa junto a los mejores proyectos.</p></div>
  </div>
</section>

<!-- 5 · PLANES -->
<section class="band bgx bg-aurora" id="planes">
  <div class="sh rv" style="justify-content:center;text-align:center"><h2><small class="mono">Planes</small>Elige cómo quieres aparecer</h2></div>
  <div class="plans2">${PLANS.map(p => `
    <div class="plan2 ${p.hi ? 'hi' : ''} rv"><span class="tag">${p.tag}</span><h3>${p.id}</h3>
      <div class="pr"><small>$</small>${p.price}<span>/mes</span></div>
      <ul>${p.items.map(i => `<li><i class="fa-solid fa-check"></i>${i}</li>`).join('')}</ul>
      <a href="solicitud.html?plan=${p.id}" class="${p.hi ? 'btn' : 'btn-sec'}">Elegir ${p.id}</a></div>`).join('')}</div>
  <p class="muted" style="text-align:center;font-size:13px;margin-top:22px">${T.plansNote}</p>
</section>

<!-- 6 · TESTIMONIO -->
<section class="band bgx bg-photo" style="--photo:url('${BM.img(BM.C.global.bandPhoto, 1800, 900)}')">
  <figure class="testi rv"><i class="fa-solid fa-quote-left"></i>
    <blockquote>${T.testimonial[0]}</blockquote>
    <figcaption><span class="av">${T.testimonial[1].split(' ').map(w => w[0]).slice(0, 2).join('').toUpperCase()}</span><span><b>${T.testimonial[1]}</b><small>${T.testimonial[2]}</small></span></figcaption></figure>
</section>

<!-- 8 · FAQ -->
<section class="band bgx bg-light light faq">
  <div class="sh rv"><h2><small class="mono">Preguntas frecuentes</small>Resolvemos tus dudas</h2></div>
  <div class="faq2">${FAQ.map(([q, a], i) => `<details class="rv" ${i ? '' : 'open'}><summary>${q}<i class="fa-solid fa-plus"></i></summary><p>${a}</p></details>`).join('')}</div>
</section>

<!-- 9 · CTA FINAL -->
<section class="band">
  <div class="final rv"><h2>${T.finalTitle}</h2><a href="solicitud.html" class="btn">Anunciar mi proyecto <i class="fa-solid fa-arrow-right"></i></a></div>
</section>`;

BM.reveal();
</script>
</body>
</html>
