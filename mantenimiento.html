<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bloque Maestro — Muy pronto</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/assets/icono_claro_sin_fondo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;800&family=Michroma&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:#070d16;color:#e8eef5;font-family:'Manrope',sans-serif;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;
    background-image:radial-gradient(circle at 75% 20%,rgba(16,168,232,.22),transparent 40%),radial-gradient(circle at 15% 85%,rgba(76,92,214,.16),transparent 40%)}
  main{max-width:560px}
  img{height:70px;margin-bottom:44px}
  .k{font-family:'Michroma',sans-serif;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:#10A8E8}
  h1{font-weight:800;font-size:clamp(34px,7vw,56px);letter-spacing:-.035em;line-height:1.05;margin:18px 0}
  p{color:#9fb0c1;font-size:17px;line-height:1.6}
  a{color:#10A8E8;text-decoration:none;font-weight:600}
</style>
</head>
<body>
<main>
  <img src="/assets/logo_oscuro_horizontal.png" alt="Bloque Maestro">
  <div class="k">Muy pronto</div>
  <h1>Estamos construyendo algo grande.</h1>
  <p>La revista de proyectos de construcción abrirá muy pronto.</p>
</main>
</body>
</html>
