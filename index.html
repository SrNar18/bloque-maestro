<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bloque Maestro — La revista de proyectos de construcción</title>
<link rel="canonical" href="https://bloquemaestro.com/">
<meta name="description" content="Proyectos de construcción contados por dentro: materiales, equipos, terreno, iluminación y quién los hizo. Contacta directamente con sus promotores.">
<link rel="icon" href="assets/icono_claro_sin_fondo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Inter:wght@300;400;500;600;700&family=Michroma&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="assets/styles.css?v=17">
</head>
<body data-page="home">
<main id="app"></main>

<script src="assets/data.js?v=4"></script>
<script src="assets/app.js?v=7"></script>
<script>
const P = BM.PROJECTS, by = BM.byId;
const count = id => P.filter(p => p.cat === id).length;
const HERO = ['torre-alameda', 'oficinas-prisma', 'casa-patio-lomas', 'puente-rio-claro', 'edificio-1928'].map(by);
const LOGOS = [['fa-cubes','Altavista','GRUPO'],['fa-bridge','Vías del Oriente',''],['fa-building','Prisma','ARQ'],['fa-leaf','Habitar Verde',''],['fa-industry','LogiPark',''],['fa-landmark','Patrimonia',''],['fa-tree','Bosque Vivo',''],['fa-helmet-safety','Constructora Andes','']];
const WORDS = ['reales', 'únicas', 'sostenibles', 'en marcha', 'que inspiran'];
const MES = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
const catChip = c => `<span class="cchip" style="--c:${BM.CAT_COLOR[c]}">${BM.catName(c)}</span>`;
const pad = n => String(n).padStart(2, '0');
const AUD = [
  ['Inversores', 'fa-chart-line', '#10A8E8', 0, 'Encuentra proyectos con datos técnicos reales y habla directamente con el promotor.', 'proyectos.html', 'Ver oportunidades'],
  ['Proveedores', 'fa-truck-ramp-box', '#f59e0b', 2, 'Descubre qué materiales y equipos usa cada obra y ofrece los tuyos.', 'proyectos.html?cat=industrial', 'Buscar obras'],
  ['Profesionales', 'fa-compass-drafting', '#14b8a6', 25, 'Inspírate con soluciones de terreno, estructura e iluminación de otros equipos.', 'proyectos.html', 'Explorar fichas'],
  ['Promotores', 'fa-bullhorn', '#e0559b', 12, 'Publica tu obra y recibe contactos cualificados en tu correo.', 'solicitud.html', 'Anunciar mi proyecto'],
];

document.getElementById('app').innerHTML = `
<!-- ============ HERO · galería a pantalla completa ============ -->
<section class="hero2" id="hero">
  <div class="slides">${HERO.map((p, i) => `<div class="slide ${i ? '' : 'on'}"><img src="${BM.img(p.img[0], 2000, 1300)}" alt="" ${i ? 'loading="lazy"' : 'fetchpriority="high"'}></div>`).join('')}</div>
  <div class="hero2-shade"></div>
  <button class="harr prev" aria-label="Anterior"><i class="fa-solid fa-chevron-left"></i></button>
  <button class="harr next" aria-label="Siguiente"><i class="fa-solid fa-chevron-right"></i></button>
  <div class="w hero2-in">
    <div class="hero2-txt rv">
      <div class="kick">Proyectos 2026</div>
      <h1 class="display">Obras <em class="rot"><span>${WORDS[0]}</span></em><br>contadas por dentro.</h1>
      <p class="lead">La revista que muestra los proyectos de construcción por dentro: materiales, equipos, terreno y quién los hace. Descúbrelos y contacta directamente con sus promotores.</p>
      <div class="ctas"><a href="proyectos.html" class="btn">Explorar proyectos <i class="fa-solid fa-arrow-right"></i></a><a href="solicitud.html" class="btn-sec">Anuncia tu proyecto</a></div>
      <div class="hero2-stats"><div><b data-n="${P.length * 6}" data-suf="+">0</b><small>Proyectos</small></div><div><b data-n="31" data-suf="K">0</b><small>Lectores / mes</small></div><div><b data-n="1240" data-suf="+">0</b><small>Contactos</small></div></div>
    </div>
    <div class="hero2-bar">
      <a class="now" id="now" href="${BM.url(HERO[0])}"><span class="lbl">En portada</span><b></b><small></small><i class="fa-solid fa-arrow-right"></i></a>
      <span class="hcount"><b id="hc">01</b> / ${pad(HERO.length)}</span>
    </div>
  </div>
</section>
<div class="trust-strip"><p>Promotores y constructoras que ya publican en Bloque Maestro</p><div class="logos"><div>${[...LOGOS, ...LOGOS].map(([i, n, t]) => `<span><i class="fa-solid ${i}"></i>${n}${t ? ` <em>${t}</em>` : ''}</span>`).join('')}</div></div></div>

<div class="w">
  <!-- ============ QUÉ ES · para quién ============ -->
  <section class="band bgx bg-light light" id="que-es">
    <div class="qe-head rv">
      <div><div class="kick">Qué es Bloque Maestro</div><h2 class="qe-t">La vitrina donde los proyectos de construcción <em>encuentran a su gente</em>.</h2></div>
      <p>Cada proyecto se publica como un reportaje técnico. Quien lo lee puede pedir más información con un clic, y el promotor recibe el contacto directamente.</p>
    </div>
    <div class="aud">${AUD.map(([t, ic, c, img, d, href, cta]) => `
      <a class="au rv" href="${href}" style="--c:${c}">${BM.ph(img, 600, 760)}
        <span class="au-ic"><i class="fa-solid ${ic}"></i></span>
        <div class="au-in"><small>Para</small><b>${t}</b><p>${d}</p><span class="au-go">${cta} <i class="fa-solid fa-arrow-right"></i></span></div></a>`).join('')}</div>
  </section>

  <section class="section" id="destacados" style="padding-top:100px;scroll-margin-top:60px">
    <div class="sh rv"><h2><small class="mono">01 — Destacados</small>Proyectos en portada</h2><a class="link" href="proyectos.html">Ver todos <i class="fa-solid fa-arrow-right"></i></a></div>
    <div class="bento">
      ${BM.bentoCard(by('torre-alameda'), 'xl', 1200, 900)}
      ${BM.bentoCard(by('puente-rio-claro'), 'tl', 600, 900)}
      <div class="card txt rv"><div class="in"><div class="big" data-n="85" data-suf="%">0</div><h3>menos energía</h3><p>Lo que consumirá el Ecobarrio La Huerta frente a una promoción convencional.</p></div></div>
      ${BM.bentoCard(by('casa-patio-lomas'), '', 600, 420)}
      ${BM.bentoCard(by('hub-logistico-norte'), 'wd', 1200, 420)}
      ${BM.bentoCard(by('oficinas-prisma'), 'wd', 1200, 420)}
    </div>
  </section>

  <section class="band bgx bg-light light">
    <div class="sh rv"><h2><small class="mono">02 — Explora</small>Proyectos por sector</h2><a class="link" href="proyectos.html">Todos los sectores <i class="fa-solid fa-arrow-right"></i></a></div>
    <div class="cats">${BM.CATS.map((c, i) => `<a class="cat rv" href="proyectos.html?cat=${c.id}"><span class="n">${pad(i + 1)}</span><i class="fa-solid ${c.icon}"></i><b>${c.name}</b><small>${c.desc} · ${count(c.id)} proyecto${count(c.id) === 1 ? '' : 's'}</small><span class="arr"><i class="fa-solid fa-arrow-right"></i></span></a>`).join('')}</div>
  </section>

  <!-- ============ POR ESTADO DE OBRA · carrusel ============ -->
  <section class="band bgx bg-aurora" id="estado">
    <div class="sh rv"><h2><small class="mono">03 — Según su estado</small>Obras en marcha, terminadas y por venir</h2>
      <div class="car-nav"><button class="harr sm" data-d="-1" aria-label="Anterior"><i class="fa-solid fa-chevron-left"></i></button><button class="harr sm" data-d="1" aria-label="Siguiente"><i class="fa-solid fa-chevron-right"></i></button></div></div>
    <div class="st-tabs rv" id="sttabs">${Object.entries(BM.STATUS).map(([k, [n, cls]], i) => `<button class="stt ${i ? '' : 'on'}" data-s="${k}"><span class="status ${cls}"></span>${n}<em>${P.filter(p => p.status === k).length}</em></button>`).join('')}</div>
    <div class="track" id="track"></div>
  </section>

  <!-- ============ RECIÉN PUBLICADOS · destacado + lista paginada ============ -->
  <section class="band bgx bg-light light" id="recientes">
    <div class="sh rv"><h2><small class="mono">04 — Último</small>Recién publicados</h2><a class="link" href="proyectos.html">Archivo completo <i class="fa-solid fa-arrow-right"></i></a></div>
    <div class="rec-filters rv" id="recf"></div>
    <div id="recfeat"></div>
    <div class="rec-list" id="recl"></div>
    <nav class="pager" id="pager" aria-label="Paginación"></nav>
  </section>

  <!-- ============ CÓMO FUNCIONA · pasos interactivos ============ -->
  <section class="band bgx bg-blueprint" id="como-funciona">
    <div class="sh rv"><h2><small class="mono">05 — Cómo funciona</small>De la obra a la conversación</h2></div>
    <div class="how rv">
      <div class="how-steps">
        <button class="hs on" data-i="0"><span class="hn">01</span><span class="ht"><b>El promotor publica</b><small>Cuenta su obra con detalle técnico: terreno, materiales, equipos y equipo humano.</small></span><span class="hp"><i></i></span></button>
        <button class="hs" data-i="1"><span class="hn">02</span><span class="ht"><b>Tú lo descubres</b><small>Exploras fichas por sector, estado o ciudad y encuentras oportunidades reales.</small></span><span class="hp"><i></i></span></button>
        <button class="hs" data-i="2"><span class="hn">03</span><span class="ht"><b>Conectamos</b><small>Solicitas información y el equipo del proyecto te contacta directamente.</small></span><span class="hp"><i></i></span></button>
      </div>
      <div class="how-stage">
        <div class="scene on">
          <div class="sc-card sc-form">
            <div class="sc-h"><i class="fa-solid fa-pen-ruler"></i> Nueva ficha de proyecto</div>
            <div class="sc-f"><small>Proyecto</small><span class="type" style="--w:72%">Torre Alameda · 22 plantas</span></div>
            <div class="sc-f"><small>Ubicación</small><span class="type" style="--w:48%;--d:1.1s">Medellín, Colombia</span></div>
            <div class="sc-row"><div class="sc-f"><small>Superficie</small><span class="type" style="--w:60%;--d:2.2s">18.400 m²</span></div><div class="sc-f"><small>Estado</small><span class="pill">En obra</span></div></div>
            <div class="sc-thumbs">${[0, 5, 2, 7].map((i, k) => `<div style="--d:${2.6 + k * .2}s">${BM.ph(i, 160, 120)}</div>`).join('')}</div>
            <div class="sc-tags"><span>Hormigón HA-35</span><span>Grúa torre</span><span>Fachada ventilada</span><span>LED DALI</span></div>
          </div>
          <div class="sc-float f1"><i class="fa-solid fa-circle-check"></i> Ficha lista para publicar</div>
        </div>
        <div class="scene">
          <div class="sc-search"><i class="fa-solid fa-magnifying-glass"></i><span class="type" style="--w:58%">fachada ventilada Medellín</span></div>
          <div class="sc-grid">${['torre-alameda', 'hub-logistico-norte', 'ecobarrio-la-huerta'].map(by).map((p, k) => `<div class="sc-p" style="--d:${1.1 + k * .2}s">${BM.ph(p.img[0], 360, 260)}<div><span class="status ${BM.STATUS[p.status][1]}">${BM.STATUS[p.status][0]}</span><b>${p.short}</b><small>${p.city}</small></div></div>`).join('')}</div>
          <div class="sc-cursor"><i class="fa-solid fa-arrow-pointer"></i></div>
        </div>
        <div class="scene">
          <div class="sc-inbox">
            <div class="sc-h"><i class="fa-solid fa-inbox"></i> Solicitudes · Torre Alameda <span class="badge">3 nuevas</span></div>
            ${[['CM', 'Carlos Méndez', 'Inversor · Fondo Andino Capital', 'Nos interesa la estructura de inversión…'], ['LR', 'Laura Ríos', 'Proveedor · Aceros del Valle', '¿Tenéis previstas nuevas compras de acero?'], ['JP', 'Javier Paz', 'Profesional · Estudio JP', 'Me gustaría conocer el sistema de fachada…']].map(([a, n, r, m], k) => `<div class="sc-mail" style="--d:${.3 + k * .45}s"><span class="av">${a}</span><span><b>${n}</b><small>${r}</small><em>${m}</em></span><i class="fa-solid fa-circle"></i></div>`).join('')}
          </div>
          <div class="sc-float f3"><i class="fa-solid fa-handshake"></i> +37 contactos este mes</div>
        </div>
      </div>
    </div>
  </section>

  <section class="band">
    <div class="adband rv">
      <div class="txt"><div class="kick">Para promotores y constructoras</div><h2>Tu proyecto, frente a quien puede impulsarlo</h2>
        <p class="muted">Publica la ficha técnica de tu obra y recibe solicitudes de información de inversores, proveedores y profesionales cualificados.</p>
        <ul><li><i class="fa-solid fa-check"></i>Ficha técnica completa redactada por nuestro equipo</li><li><i class="fa-solid fa-check"></i>Formulario de contacto conectado a tu correo</li><li><i class="fa-solid fa-check"></i>Difusión en newsletter y redes sociales</li></ul>
        <div class="ctas" style="margin-top:0"><a href="solicitud.html" class="btn">Anunciar mi proyecto <i class="fa-solid fa-arrow-right"></i></a><a href="anunciate.html" class="link">Cómo funciona y planes <i class="fa-solid fa-arrow-right"></i></a></div></div>
      <div class="vis">${BM.ph(2, 900, 800)}<div class="mock"><div class="r"><span>Visitas a la ficha · 30 días</span><b>4.812</b></div><div class="r"><span>Solicitudes de información</span><b>37</b></div><div class="r"><span>Perfil más frecuente</span><span>Proveedores</span></div></div></div>
    </div>
  </section>

</div>`;

/* ---------- Hero: galería con flechas + palabra rotativa ---------- */
(() => {
  const slides = [...document.querySelectorAll('.slide')], now = document.getElementById('now'), hc = document.getElementById('hc');
  let k = 0, t;
  const show = n => {
    slides[k].classList.remove('on');
    k = (n + slides.length) % slides.length;
    slides[k].classList.add('on');
    const p = HERO[k]; now.href = BM.url(p); hc.textContent = pad(k + 1);
    now.querySelector('b').textContent = p.short; now.querySelector('small').textContent = `${BM.catName(p.cat)} · ${p.city}`;
    clearTimeout(t); t = setTimeout(() => show(k + 1), 7000);
  };
  document.querySelector('.harr.prev').onclick = () => show(k - 1);
  document.querySelector('.harr.next').onclick = () => show(k + 1);
  document.addEventListener('keydown', e => { if (scrollY < innerHeight / 2 && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')) show(k + (e.key === 'ArrowLeft' ? -1 : 1)); });
  show(0);
  const rot = document.querySelector('.rot span'); let w = 0;
  setInterval(() => { rot.classList.add('out'); setTimeout(() => { w = (w + 1) % WORDS.length; rot.textContent = WORDS[w]; rot.classList.remove('out'); }, 400); }, 2600);
})();

/* ---------- Por estado: pestañas + carrusel ---------- */
(() => {
  const track = document.getElementById('track'), tabs = document.getElementById('sttabs');
  const render = s => {
    track.innerHTML = P.filter(p => p.status === s).map(p => `
      <a class="tc" href="${BM.url(p)}">${BM.ph(p.img[0], 640, 440)}
        <div class="tc-b">${catChip(p.cat)}<b>${p.title}</b><small><i class="fa-solid fa-location-dot"></i> ${p.city} · ${p.area}</small>
          <div class="tc-p"><span>Avance</span><div class="bar2"><i style="width:${p.progress}%"></i></div><em>${p.progress}%</em></div></div></a>`).join('');
    track.scrollLeft = 0;
  };
  tabs.onclick = e => { const b = e.target.closest('.stt'); if (!b) return; tabs.querySelectorAll('.stt').forEach(x => x.classList.toggle('on', x === b)); render(b.dataset.s); };
  document.querySelectorAll('.car-nav .harr').forEach(b => b.onclick = () => track.scrollBy({ left: b.dataset.d * (track.clientWidth * .8), behavior: 'smooth' }));
  render('obra');
})();

/* ---------- Cómo funciona: avance automático entre pasos ---------- */
(() => {
  const btns = [...document.querySelectorAll('.hs')], scenes = [...document.querySelectorAll('.scene')];
  let k = 0, t;
  const go = n => {
    btns.forEach((b, i) => b.classList.toggle('on', i === n));
    scenes.forEach((s, i) => { s.classList.remove('on'); if (i === n) { void s.offsetWidth; s.classList.add('on'); } });
    k = n; clearTimeout(t); t = setTimeout(() => go((k + 1) % btns.length), 6000);
  };
  btns.forEach((b, i) => b.onclick = () => go(i));
  new IntersectionObserver(([e]) => { if (e.isIntersecting) go(k); else clearTimeout(t); }, { threshold: .3 }).observe(document.querySelector('.how'));
})();

/* ---------- Recién publicados: destacado ancho + lista paginada ---------- */
(() => {
  const PER = 6; let cat = '', page = 1;
  const f = document.getElementById('recf'), l = document.getElementById('recl'), feat = document.getElementById('recfeat'), pager = document.getElementById('pager');
  f.innerHTML = [{ id: '', name: 'Todo' }, ...BM.CATS].map(c => `<button class="btn-sec btn-sm ${c.id ? '' : 'on'}" data-c="${c.id}">${c.id ? `<i class="dotc" style="--c:${BM.CAT_COLOR[c.id]}"></i>` : ''}${c.name}</button>`).join('');
  f.onclick = e => { const b = e.target.closest('button'); if (!b) return; cat = b.dataset.c; page = 1; f.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b)); render(); };
  pager.onclick = e => { const b = e.target.closest('button'); if (!b || b.disabled) return; page = +b.dataset.p; render(); document.getElementById('recl').scrollIntoView({ behavior: 'smooth', block: 'start' }); };
  function render() {
    const all = BM.PROJECTS_BY_DATE.filter(p => !cat || p.cat === cat), top = all[0], rest = all.slice(1);
    const pages = Math.max(1, Math.ceil(rest.length / PER)), items = rest.slice((page - 1) * PER, page * PER);
    feat.innerHTML = top ? `<a class="rf2" href="${BM.url(top)}" style="--c:${BM.CAT_COLOR[top.cat]}">${BM.ph(top.img[0], 1200, 800)}
      <div class="rf2-in"><div class="rf2-top"><span class="new">Nuevo · ${top.pub.getDate()} ${MES[top.pub.getMonth()]}</span>${catChip(top.cat)}${BM.status(top.status)}</div>
        <h3>${top.title}</h3><p>${top.summary}</p>
        <div class="rf2-facts"><span><small>Superficie</small><b>${top.area}</b></span><span><small>Ubicación</small><b>${top.city}</b></span><span><small>Promotor</small><b>${top.owner.name}</b></span></div>
        <span class="link">Leer la ficha completa <i class="fa-solid fa-arrow-right"></i></span></div></a>` : '';
    l.innerHTML = items.map(p => `<a class="ri" href="${BM.url(p)}" style="--c:${BM.CAT_COLOR[p.cat]}">
        <span class="rd"><b>${pad(p.pub.getDate())}</b><small>${MES[p.pub.getMonth()].slice(0, 3)}</small></span>
        ${BM.ph(p.img[0], 260, 180)}
        <span class="rt">${catChip(p.cat)}<b>${p.title}</b><small><i class="fa-solid fa-location-dot"></i> ${p.city} · ${p.owner.name}</small></span>
        <span class="rs">${BM.status(p.status)}<i class="fa-solid fa-arrow-right"></i></span></a>`).join('') || '<p class="muted" style="text-align:center;padding:20px">No hay más proyectos en este sector todavía.</p>';
    pager.innerHTML = pages < 2 ? '' : `<button class="btn-sec btn-sm" data-p="${page - 1}" ${page === 1 ? 'disabled' : ''} aria-label="Anterior"><i class="fa-solid fa-chevron-left"></i></button>`
      + Array.from({ length: pages }, (_, i) => `<button class="btn-sec btn-sm ${i + 1 === page ? 'on' : ''}" data-p="${i + 1}">${i + 1}</button>`).join('')
      + `<button class="btn-sec btn-sm" data-p="${page + 1}" ${page === pages ? 'disabled' : ''} aria-label="Siguiente"><i class="fa-solid fa-chevron-right"></i></button>`;
  }
  render();
})();
BM.initForms(); BM.reveal();
</script>
</body>
</html>
