<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Maqueta en revisión: no indexar. Quitar esta línea al lanzar la web. -->
<meta name="robots" content="noindex, nofollow">
<title>Contacto — Bloque Maestro</title>
<link rel="canonical" href="https://bloquemaestro.com/contacto.html">
<meta name="description" content="Contacta con el equipo de Bloque Maestro: publicidad, prensa, colaboraciones y dudas sobre proyectos.">
<link rel="icon" href="assets/icono_claro_sin_fondo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Inter:wght@300;400;500;600;700&family=Michroma&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="assets/styles.css?v=18">
</head>
<body data-page="contacto">
<main class="w" id="app"></main>

<script>/* Contenido editable desde /admin (con ?preview muestra el borrador del panel) */
(function () { try { var d = (/[?&]preview/.test(location.search) || window.top !== window) && localStorage.getItem('bm_preview'); if (d) { window.BM_CONTENT = JSON.parse(d); return; } } catch (e) {}
  document.write('<script src="assets/content.js?t=' + Math.floor(Date.now() / 6e4) + '"><\/script>'); })();</script>
<script src="assets/data.js?v=5"></script>
<script src="assets/app.js?v=8"></script>
<script>
const MOTIVOS = [['general', 'Consulta general', 'fa-comment-dots'], ['proyecto', 'Sobre un proyecto publicado', 'fa-building'], ['publicidad', 'Publicidad y planes', 'fa-bullhorn'], ['prensa', 'Prensa y colaboraciones', 'fa-newspaper'], ['empleo', 'Trabajar con nosotros', 'fa-briefcase']];
const T = BM.C.contacto, G = BM.C.global, tel = s => s.replace(/[^+\d]/g, '');
const pre = new URLSearchParams(location.search);
const m0 = MOTIVOS.some(m => m[0] === pre.get('motivo')) ? pre.get('motivo') : 'general';

document.getElementById('app').innerHTML = `
<section class="ct-hero bgx bg-hero">
  <div>
    <div class="crumbs"><a href="index.html">Inicio</a><i class="fa-solid fa-chevron-right"></i>Contacto</div>
    <div class="kick">Contacto</div>
    <h1>${T.title}</h1>
    <p class="lead">${T.lead}</p>
  </div>
  <div class="ct-live"><span class="dot"></span><b>Equipo disponible</b><small>${T.availability}</small><div class="ct-faces">${['LM', 'AR', 'CS', 'JO'].map(i => `<span>${i}</span>`).join('')}<em>${T.response}</em></div></div>
</section>

<!-- Vías rápidas -->
<section class="ct-ways">
  <a class="cw hi" href="solicitud.html"><i class="fa-solid fa-rocket"></i><b>Quiero anunciar mi proyecto</b><small>Ve directo a la solicitud en 4 pasos.</small><span class="link">Empezar solicitud <i class="fa-solid fa-arrow-right"></i></span></a>
  <a class="cw" href="mailto:${G.emailProyectos}"><i class="fa-solid fa-building"></i><b>Proyectos y promotores</b><small>${G.emailProyectos}</small><span class="link">Escribir <i class="fa-solid fa-arrow-right"></i></span></a>
  <a class="cw" href="mailto:${G.emailPrensa}"><i class="fa-solid fa-newspaper"></i><b>Prensa y colaboraciones</b><small>${G.emailPrensa}</small><span class="link">Escribir <i class="fa-solid fa-arrow-right"></i></span></a>
  <a class="cw" href="https://wa.me/${tel(G.whatsapp).replace('+', '')}" target="_blank" rel="noopener"><i class="fa-brands fa-whatsapp"></i><b>WhatsApp</b><small>${G.whatsapp}</small><span class="link">Abrir chat <i class="fa-solid fa-arrow-right"></i></span></a>
</section>

<!-- Formulario + datos -->
<section class="band ct-main">
  <form class="ct-form" id="cf" novalidate>
    <div class="kick">Formulario de contacto</div><h2>Envíanos un mensaje</h2>
    <div class="f full"><label>¿Sobre qué quieres hablar? <em>*</em></label><div class="opts cols3 mot">${MOTIVOS.map(([v, n, ic]) => `<label class="opt"><input type="radio" name="motivo" value="${v}" ${v === m0 ? 'checked' : ''}><span><i class="fa-solid ${ic}"></i>${n}</span></label>`).join('')}</div></div>
    <div class="f full cond" data-for="proyecto"><label>¿Qué proyecto? <em>*</em></label><select name="pid"><option value="">Selecciona un proyecto…</option>${BM.PROJECTS.map(p => `<option value="${p.id}">${p.short} · ${p.city}</option>`).join('')}</select></div>
    <div class="f full cond" data-for="publicidad"><div class="hint"><i class="fa-solid fa-lightbulb"></i> ¿Quieres publicar un proyecto? Es más rápido con la <a class="link" href="solicitud.html" style="font-size:14px">solicitud en 4 pasos</a>.</div></div>
    <div class="grid2">
      <div class="f"><label>Nombre y apellidos <em>*</em></label><input name="nombre" required autocomplete="name"></div>
      <div class="f"><label>Empresa</label><input name="empresa" autocomplete="organization"></div>
      <div class="f"><label>Correo electrónico <em>*</em></label><input type="email" name="email" required autocomplete="email"></div>
      <div class="f"><label>Teléfono</label><input type="tel" name="tel" autocomplete="tel"></div>
    </div>
    <div class="f full"><label>Mensaje <em>*</em></label><textarea name="msg" rows="6" required maxlength="1000" placeholder="Cuéntanos en qué podemos ayudarte…"></textarea><small class="count" id="cc">0 / 1000</small></div>
    <label class="check"><input type="checkbox" required> Acepto la <a class="link" href="#" style="font-size:13px">política de privacidad</a>.</label>
    <div class="ct-send"><button class="btn" type="submit">Enviar mensaje <i class="fa-solid fa-paper-plane"></i></button><small class="muted"><i class="fa-solid fa-lock"></i> Nunca compartimos tus datos.</small></div>
    <div class="ct-ok" hidden><div class="ok-ic"><i class="fa-solid fa-check"></i></div><h3>¡Mensaje enviado!</h3><p class="muted">Gracias, <b id="okname" style="color:#fff"></b>. Te responderemos en <b style="color:#fff" id="okmail"></b> en menos de 24 h.</p><button type="button" class="btn-sec" id="again">Enviar otro mensaje</button></div>
  </form>

  <aside class="ct-info">
    <div class="ci-map">
      <svg viewBox="0 0 400 260" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
        <defs><pattern id="g" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="rgba(16,168,232,.12)"/></pattern></defs>
        <rect width="400" height="260" fill="#0c1b2d"/><rect width="400" height="260" fill="url(#g)"/>
        <path d="M-10 190 C80 160 120 210 200 170 S330 120 420 150" stroke="rgba(16,168,232,.35)" stroke-width="10" fill="none"/>
        <path d="M60 -10 L150 270 M260 -10 L230 270 M-10 80 L410 110" stroke="rgba(255,255,255,.08)" stroke-width="6" fill="none"/>
        <circle cx="205" cy="118" r="34" fill="rgba(16,168,232,.18)"><animate attributeName="r" values="18;40;18" dur="2.6s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0;1" dur="2.6s" repeatCount="indefinite"/></circle>
        <circle cx="205" cy="118" r="9" fill="#10A8E8" stroke="#fff" stroke-width="3"/>
      </svg>
      <div class="ci-addr"><b>Oficina central</b><small>${G.address}</small></div>
    </div>
    <ul class="ci-list">
      <li><i class="fa-regular fa-envelope"></i><span><small>Email general</small><a href="mailto:${G.email}">${G.email}</a></span></li>
      <li><i class="fa-solid fa-phone"></i><span><small>Teléfono</small><a href="tel:${tel(G.phone)}">${G.phone}</a></span></li>
      <li><i class="fa-regular fa-clock"></i><span><small>Horario</small>${G.hours}</span></li>
    </ul>
    <div class="ci-social"><a href="${G.instagram}" aria-label="Instagram"><i class="fa-brands fa-instagram"></i></a><a href="${G.linkedin}" aria-label="LinkedIn"><i class="fa-brands fa-linkedin-in"></i></a><a href="${G.youtube}" aria-label="YouTube"><i class="fa-brands fa-youtube"></i></a><a href="${G.x}" aria-label="X"><i class="fa-brands fa-x-twitter"></i></a></div>
  </aside>
</section>

<!-- Preguntas rápidas -->
<section class="band bgx bg-light light faq">
  <div class="sh"><h2><small class="mono">Antes de escribir</small>Quizá ya tenemos la respuesta</h2></div>
  <div class="faq2">${T.faq.map(([q, a], i) => `<details ${i ? '' : 'open'}><summary>${q}<i class="fa-solid fa-plus"></i></summary><p>${a}</p></details>`).join('')}</div>
</section>`;

/* ---------- Formulario ---------- */
const f = document.getElementById('cf');
const cond = () => { const m = f.querySelector('[name=motivo]:checked').value; f.querySelectorAll('.cond').forEach(c => { const on = c.dataset.for === m; c.hidden = !on; const s = c.querySelector('select'); if (s) s.required = on; }); };
f.addEventListener('change', cond); cond();
f.msg.addEventListener('input', () => document.getElementById('cc').textContent = `${f.msg.value.length} / 1000`);
f.addEventListener('submit', e => {
  e.preventDefault(); let ok = true;
  f.querySelectorAll('[required]').forEach(el => {
    const bad = el.type === 'checkbox' ? !el.checked : !el.value.trim() || (el.type === 'email' && !/^\S+@\S+\.\S+$/.test(el.value));
    (el.closest('.f') || el.closest('.check')).classList.toggle('err', bad); if (bad) ok = false;
  });
  if (!ok) return f.querySelector('.err input,.err select,.err textarea')?.focus();
  document.getElementById('okname').textContent = f.nombre.value.split(' ')[0];
  document.getElementById('okmail').textContent = f.email.value;
  f.classList.add('done-ct'); f.querySelector('.ct-ok').hidden = false;
});
document.getElementById('again').onclick = () => { f.reset(); cond(); f.classList.remove('done-ct'); f.querySelector('.ct-ok').hidden = true; };
</script>
</body>
</html>
